[project]
name = "netsplit"
version = "0.3.9"
description = "Netsplit can help slice and dice your IP space"
authors = [{ name = "Nikos Chasiotis", email = "hasiotis@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0.1,<3",
    "ipaddress>=1.0.23,<2",
    "rich>=15.0.0,<16",
    "click>=8.0,<9",
]

[project.scripts]
netsplit = "netsplit.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "jsonpickle>=4.1.2,<5",
    "commitizen>=4.2,<5",
    "prek>=0.5.4,<0.6",
]

[tool.pytest.ini_options]
addopts = "-ra -q"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github"]
