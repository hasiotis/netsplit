name: Pull Request
run-name: Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "main"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m pytest tests --junitxml=report.xml

      - name: Unit Test Results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: unit-tests-results
          path: report.xml
          reporter: java-junit
